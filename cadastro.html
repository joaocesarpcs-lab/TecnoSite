<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TechStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TechStore</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="cadastro.html" aria-current="page">Cadastro</a>
            <a href="login.html">Entrar</a>
            <a href="carrinho.html">Carrinho</a>
        </nav>
    </header>

    <main>
        <section class="cadastro" aria-labelledby="titulo-cadastro">
            <h2 id="titulo-cadastro">Crie sua conta</h2>
            <p class="texto-cadastro">
                Cadastre-se para ter acesso à TechStore.
            </p>

            <form id="formCadastro">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" autocomplete="name"
                    minlength="3" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                    placeholder="Digite seu e-mail" autocomplete="email"
                    required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha"
                    placeholder="Mínimo de 6 caracteres"
                    autocomplete="new-password" minlength="6" required>

                <label for="confirmar-senha">Confirmar senha:</label>
                <input type="password" id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Digite a senha novamente"
                    autocomplete="new-password" minlength="6" required>

                <button type="submit">Cadastrar</button>

                <p id="mensagemCadastro" class="mensagem"
                    role="status" aria-live="polite"></p>
            </form>

            <p class="link-login">
                Já possui uma conta?
                <a href="login.html">Entrar na sua conta</a>
            </p>
        </section>
    </main>

    <footer>
        <h2>TechStore</h2>
        <p>Peças, computadores e equipamentos de tecnologia.</p>
        <p>Contato: <a href="mailto:contato@techstore.com">contato@techstore.com</a></p>
        <p>© 2026 TechStore - Todos os direitos reservados.</p>
    </footer>

    <script>
        const formulario = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagemCadastro");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;

            function mostrarMensagem(texto, tipo) {
                mensagem.textContent = texto;
                mensagem.className = "mensagem " + tipo;
            }

            if (nome.length < 3) {
                mostrarMensagem("Digite seu nome completo.", "erro");
                return;
            }

            if (senha.length < 6) {
                mostrarMensagem("A senha precisa ter pelo menos 6 caracteres.", "erro");
                return;
            }

            if (senha !== confirmarSenha) {
                mostrarMensagem("As senhas não são iguais!", "erro");
                return;
            }

            let usuarios = [];

            try {
                const dadosSalvos = JSON.parse(localStorage.getItem("usuarios") || "[]");
                if (Array.isArray(dadosSalvos)) {
                    usuarios = dadosSalvos;
                }
            } catch {
                usuarios = [];
            }

            const emailExiste = usuarios.some(function(usuario) {
                return usuario && usuario.email === email;
            });

            if (emailExiste) {
                mostrarMensagem("Este e-mail já está cadastrado!", "erro");
                return;
            }

            usuarios.push({
                nome: nome,
                email: email,
                senha: senha
            });

            try {
                localStorage.setItem("usuarios", JSON.stringify(usuarios));
            } catch {
                mostrarMensagem("Não foi possível salvar o cadastro neste navegador.", "erro");
                return;
            }

            mostrarMensagem("Cadastro realizado com sucesso! Você já pode entrar.", "sucesso");
            formulario.reset();
        });
    </script>
</body>
</html>
