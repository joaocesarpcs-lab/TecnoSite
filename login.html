<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - TechStore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>TechStore</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Entrar</a>
        </nav>

    </header>

    <main>

        <section class="cadastro" aria-labelledby="titulo-login">

            <h2 id="titulo-login">Entrar na sua conta</h2>

            <p class="texto-cadastro">
                Acesse sua conta TechStore.
            </p>

            <form id="formLogin">

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

                <p id="mensagemLogin" class="mensagem" role="status"></p>

            </form>

            <p class="link-login">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar uma conta</a>
            </p>

        </section>

    </main>

    <footer>

        <h2>TechStore</h2>

        <p>
            Peças, computadores e equipamentos de tecnologia.
        </p>

        <p>
            Contato: contato@techstore.com
        </p>

        <p>
            © 2026 TechStore - Todos os direitos reservados.
        </p>

    </footer>

    <script>

        const formulario = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagemLogin");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;

            const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            const usuario = usuarios.find(function(usuario) {
                return usuario.email === email;
            });

            if (!usuario) {
                mensagem.textContent = "Conta não encontrada. Verifique o e-mail.";
                mensagem.className = "mensagem erro";
                return;
            }

            if (usuario.senha !== senha) {
                mensagem.textContent = "Senha incorreta. Tente novamente.";
                mensagem.className = "mensagem erro";
                return;
            }

            mensagem.textContent = "Login realizado com sucesso!";
            mensagem.className = "mensagem sucesso";

            formulario.reset();

        });

    </script>

</body>

</html>
